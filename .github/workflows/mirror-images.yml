# -----------------------------------------------------------------------------
# Espelha uma imagem pública (Docker Hub) para o OCIR, sem Docker na máquina local.
# Executar em: Actions > mirror-images > Run workflow
#
# Usa "buildx imagetools create": copia o manifesto multi-arquitetura direto
# de registry para registry (amd64 e arm64), sem baixar/rodar a imagem.
# Pré-requisito: repositório PRIVADO já criado no OCIR, no compartment certo
# (se não existir, o OCIR cria automaticamente no compartment ROOT).
# -----------------------------------------------------------------------------
name: mirror-images

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Imagem de origem"
        required: true
        default: "docker.io/library/redis:7.4-alpine"
      target:
        description: "Repositório:tag de destino no OCIR (sem host/namespace)"
        required: true
        default: "mirror/redis:7.4-alpine"

permissions:
  contents: read

env:
  OCIR_HOST: gru.ocir.io

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login no OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_HOST }}
          username: ${{ vars.OCIR_NAMESPACE }}/${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Copiar imagem (todas as arquiteturas)
        run: |
          DEST="${OCIR_HOST}/${{ vars.OCIR_NAMESPACE }}/${{ inputs.target }}"
          docker buildx imagetools create --tag "$DEST" "${{ inputs.source }}"
          docker buildx imagetools inspect "$DEST"
          DIGEST=$(docker buildx imagetools inspect "$DEST" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "### Imagem espelhada"
            echo "- Origem: \`${{ inputs.source }}\`"
            echo "- Destino: \`$DEST\`"
            echo "- Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
