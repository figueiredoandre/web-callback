# -----------------------------------------------------------------------------
# Proxy de borda (TLS) para o Web Callback — papel equivalente ao Ingress no K8s.
# Certificado em /etc/nginx/tls/tls.crt e tls.key: MESMOS nomes das chaves de um
# Secret kubernetes.io/tls -> no K8s o par vira "kubectl create secret tls".
# -----------------------------------------------------------------------------
server_tokens off;                 # sem versão do nginx em headers/páginas de erro
client_max_body_size 64k;          # body da ida é um JSON pequeno (JWK RSA <= 4096 bits)
client_body_timeout 10s;
client_header_timeout 10s;

upstream web_callback {
    server web-callback:8080;      # nome do serviço no compose (no K8s: o Service)
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;   # certificado + cadeia intermediária
    ssl_certificate_key /etc/nginx/tls/tls.key;   # chave privada sem senha
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Só o contexto da aplicação é publicado
    location /iwlcb/ {
        limit_except GET POST { deny all; }
        proxy_pass http://web_callback;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        # borda: sobrescreve (não concatena) para o cliente não forjar o IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
        proxy_hide_header X-Powered-By;
    }

    # Healthcheck do próprio proxy (não chega ao Tomcat)
    location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Qualquer outro caminho: 404 neutro, sem identificar servidor
    location / {
        default_type application/json;
        return 404 '{"error":"not found"}';
    }
}
